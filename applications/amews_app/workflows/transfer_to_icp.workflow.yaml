name: Transfer_into_icp

metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Workflow to open big kahuna door
  version: 0.2
  
parameters:
  json_inputs:
    - key: source_location
steps:
  - name: Home UR
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up
  - name: Position rail
    node: vention_rail_RAPID200
    action: move
    args:
      speed: 30
      acceleration: 30
    parameters:
      locations:
        position: source_location
  - name: Pick up tube rack
    node: ur_RAPID200
    action: gripper_pick
    args:
      joint_angle_locations: false
    locations: 
      home: supply_station_safe
    parameters:
      locations:
        source: source_location
  - name: Move to Safe
    node: ur_RAPID200
    action: movej
    locations:
       joints: arm_safe_up
  - name: Move rail
    node: vention_rail_RAPID200
    action: move
    args:
      speed: 30
      acceleration: 30
    locations:
      position: icp_safe
  - name: Place In ICP
    node: ur_RAPID200
    action: gripper_place
    args:
      joint_angle_locations: false
    locations:
      home: icp_safe
      target: icp_tube_rack_linear
  - name: Home UR
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up
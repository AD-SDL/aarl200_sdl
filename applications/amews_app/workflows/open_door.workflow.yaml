name: Open_Door

metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Workflow to open big kahuna door
  version: 0.2

steps:
  - name: Home UR
    node: ur_aarl200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up
  - name: Home Rail
    node: vention_rail_aarl200
    action: home
  - name: Back out Rail
    node: vention_rail_aarl200
    action: move
    args:
      speed: 10
      acceleration: 10
    locations:
      position: big_kahuna_rail
  - name: Close Gripper
    node: ur_aarl200
    action: toggle_gripper
    args:
      close: true
  - name: Move to approach position for door opening
    node: ur_aarl200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations: 
      joints: big_kahuna_door_closed_outside_approach
  - name: Move to door opening position
    node: ur_aarl200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations: 
      joints: big_kahuna_door_closed_outside
  - name: Open Door
    node: ur_aarl200
    action: movel
    args: 
      velocity: 0.05
      acceleration: 0.05
    locations:
       target: big_kahuna_door_open_inside
  - name: Home UR
    node: ur_aarl200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up

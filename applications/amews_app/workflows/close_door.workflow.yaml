name: Close_Door

metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Workflow to open big kahuna door
  version: 0.2

steps:
  - name: Home UR
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up
  - name: Position Rail
    node: vention_rail_RAPID200
    action: move
    args:
      speed: 10
      acceleration: 10
    locations:
      position: big_kahuna_rail
  - name: Set Params
    node: ur_RAPID200
    action: set_movement_params
    args:
      gripper_force: 50
  - name: Close Gripper
    node: ur_RAPID200
    action: toggle_gripper
    args:
      close: true
  - name: Move to door closing position
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations: 
      joints: big_kahuna_door_open_outside_approach
  - name: Move to door closing position
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations: 
      joints: big_kahuna_door_open_outside
  - name: Close Door
    node: ur_RAPID200
    action: movel
    args: 
      velocity: 0.05
      acceleration: 0.05
    locations:
       target: big_kahuna_door_closed_inside
  - name: Home UR
    node: ur_RAPID200
    action: movej
    args:
      acceleration: 0.35
      velocity: 0.35
    locations:
      joints: arm_safe_up
  - name: toggle_gripper
    node: ur_RAPID200
    action: toggle_gripper
    args:
      open: true
  - name: Set Params
    node: ur_RAPID200
    action: set_movement_params
    args:
      gripper_force: 200
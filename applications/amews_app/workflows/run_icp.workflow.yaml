
name: Run_ICP
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Runs the ICP workflow
  version: 0.2

parameters:
  json_inputs:
    - key: dataset_name
  file_inputs:
    - key: sample_info_file
  

steps:
  - name : start_plasma
    node : icp_RAPID200
    action : plasma_on
    args :
      stabilization_delay: 300

  - name : Run Analysis
    node : icp_RAPID200
    action : run_analysis
    key: icp_analysis
    args : 
      method_name : "Mina_hts_v03"
      export_template_name : "MeansTemplate.xptx"
      wavelength_realign : 0
      precalibrate : false
      use_active_method : false
      wait_for_completion : true
    parameters:
      args:
        dataset_name : dataset_name
    files:
      sample_info_file : sample_info_file
    checks : null 

  - name : Stop Plasma
    node : icp_RAPID200
    action : plasma_off
    
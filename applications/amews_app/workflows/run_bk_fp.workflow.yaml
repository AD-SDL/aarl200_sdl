name: Run a protocl on the bk
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

parameters:
  json_inputs:
    - key: library_id
  file_inputs:
    - key: chem_file
    - key: prompts_file
steps:
  - name: Read Barcode
    node: camera_RAPID200
    key: barcode
    action: read_barcode
    args:
      autofocus: false
      focus: 100
  - name: LS Sample
    node: bk_RAPID200
    key: sample
    action: run_preloaded_library
    parameters:
      args:
        library_id: library_id
    files:
      chemfile: chem_file
      promptsfile: prompts_file
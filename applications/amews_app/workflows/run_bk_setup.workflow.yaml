name: Run a protocl on the bk
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

parameters:
  json_inputs:
    - key: blank_protocol
    - key: fill_protocol
    - key: sample_protocol
    - key: load_protocol
  file_inputs:
    - key: load_chem_file
    - key: load_prompts_file
    - key: blank_chem_file
    - key: blank_prompts_file
    - key: fill_chem_file
    - key: fill_prompts_file
    - key: sample_chem_file
    - key: sample_prompts_file
steps:
  - name: Read Barcode
    node: camera_RAPID200
    key: barcode
    action: read_barcode
    args:
      autofocus: false
      focus: 100
  - name: LS load
    node: bk_RAPID200
    key: load
    action: run_preloaded_library
    parameters:
      args:
        library_id: load_protocol
    files:
      chemfile: load_chem_file
      promptsfile: load_prompts_file
  - name: LS blank
    node: bk_RAPID200
    key: blank
    action: run_preloaded_library
    parameters:
      args:
        library_id: blank_protocol
    files:
      chemfile: blank_chem_file
      promptsfile: blank_prompts_file
  - name: LS fill
    node: bk_RAPID200
    key: fill
    action: run_preloaded_library
    parameters:
      args:
        library_id: fill_protocol
    files:
      chemfile: fill_chem_file
      promptsfile: fill_prompts_file
  - name: LS Sample
    node: bk_RAPID200
    key: sample
    action: run_preloaded_library
    parameters:
      args:
        library_id: sample_protocol
    files:
      chemfile: sample_chem_file
      promptsfile: sample_prompts_file
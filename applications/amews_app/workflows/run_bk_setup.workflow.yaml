name: Run a protocl on the bk
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

parameters:
  - "name": blank_protocol
  - "name": fill_protocol
  - "name": sample_protocol
  - "name": load_protocol
  - "name": load_chem_file
  - "name": load_prompts_file
  - "name": blank_chem_file
  - "name": blank_prompts_file
  - "name": fill_chem_file
  - "name": fill_prompts_file
  - "name": sample_chem_file
  - "name": sample_prompts_file
steps:
  - name: Read Barcode
    node: camera_aarl200
    action: read_barcode
    args:
      autofocus: false
      focus: 100

name: Open_Door
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

# modules:
#   - name: sleeper
#   - name: webcam

flowdef:
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35
  - name: Move Rail to Zero
    module: vention_rail_RAPID200
    action: move
    args:
      position: 0
      speed: 20
      acceleration: 10
  - name: Home Rail
    module: vention_rail_RAPID200
    action: home
  - name: Back out Rail
    module: vention_rail_RAPID200
    action: move
    args:
      position: 50
      speed: 10
      acceleration: 10
  - name: Close Gripper
    module: ur_RAPID200
    action: toggle_gripper
    args:
      close: true
  - name: Move to door closed home position
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.door_closed_safe_joints
      velocity: 0.35
      acceleration: 0.35
  - name: Move to door opening position
    module: ur_RAPID200
    action: movel
    args:
      location: ur_RAPID200.door_closed_outside
      acceleration: 0.35
      velocity: 0.35
  - name: Open Door
    module: ur_RAPID200
    action: movel
    args:
      location: ur_RAPID200.door_open_inside
      velocity: 0.05
      acceleration: 0.05
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35

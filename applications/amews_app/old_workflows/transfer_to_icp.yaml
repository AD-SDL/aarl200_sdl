name: Transfer_To_ICP
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

# modules:
#   - name: sleeper
#   - name: webcam

flowdef:
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35
  - name: Move Rail to Pick Position
    module: vention_rail_RAPID200
    action: move
    args:
      position: payload.rail_position
      speed: 30
      acceleration: 10
  - name: Set UR Params
    module: ur_RAPID200
    action: set_movement_params
    args:
      velocity: 0.35
      acceleration: 0.35
      gripper_speed: 50
      gripper_force: 150
  - name : Test Gripper Pick
    module : ur_RAPID200
    action : gripper_pick
    args : 
      home : ur_RAPID200.supply_station_safe_joints
      source : payload.arm_position
      source_approach_axis : null
      source_approach_distance : .15
      gripper_close : null
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.travel_container_joints
      acceleration: 0.35
      velocity: 0.35
  - name: Move Rail to Place Position
    module: vention_rail_RAPID200
    action: move
    args:
      position: 150
      speed: 30
      acceleration: 10
  - name: Set UR Params
    module: ur_RAPID200
    action: set_movement_params
    args:
      velocity: 0.35
      acceleration: 0.35
      gripper_speed: 50
      gripper_force: 150
  - name : Test Gripper Place
    module : ur_RAPID200
    action : gripper_place
    args : 
      home :  ur_RAPID200.icp_safe_joints
      target : ur_RAPID200.icp
      target_approach_axis : null
      target_approach_distance : .15
      gripper_open : null
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: ur_RAPID200.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35

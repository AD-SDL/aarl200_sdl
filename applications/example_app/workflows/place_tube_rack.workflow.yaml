name: Place_Tube_Rack
metadata:
  author: Tobias Ginsburg, Kyle Hippe, Ryan D. Lewis
  info: Example workflow for WEI
  version: 0.2

# modules:
#   - name: sleeper
#   - name: webcam

flowdef:
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: payload.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35
  - name: Move Rail to Place Position
    module: vention_rail_RAPID200
    action: move
    args:
      position: payload.rail_position
      speed: 30
      acceleration: 10
  - name: Set UR Params
    module: ur_RAPID200
    action: set_movement_params
    args:
      velocity: 0.35
      acceleration: 0.35
      gripper_speed: 50
      gripper_force: 150
  - name : Test Gripper Place
    module : ur_RAPID200
    action : gripper_place
    args : 
      home : payload.arm_safe_joints
      target : payload.arm_position
      target_approach_axis : null
      target_approach_distance : .15
      gripper_open : null
  - name: Home UR
    module: ur_RAPID200
    action: movej
    args:
      joints: payload.travel_safe_joints
      acceleration: 0.35
      velocity: 0.35
